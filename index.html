<!DOCTYPE html>
<html lang="tr" data-theme="orman">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>KONSANTRASYON</title>
<style>
/* KONSANTRASYON — 06_themes/themes.css
   Theme tokens via [data-theme="orman" | "gece" | "kagit"] on <html> or <body>.
   All colours checked with contrast.js (WCAG AA). No external fonts/assets. */

:root {
  /* Typography: system stacks only (Turkish glyphs ğ ş ı İ ö ü ç supported by all) */
  --font-ui: "Segoe UI", system-ui, -apple-system, "Roboto", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --font-round: "Segoe UI Variable Display", "SF Pro Rounded", ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-num: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", "Roboto Mono", monospace;

  --fs-xs: 0.8125rem;  /* 13px – captions only */
  --fs-s: 0.9375rem;   /* 15px */
  --fs-m: 1.0625rem;   /* 17px – body default (phone) */
  --fs-l: 1.375rem;    /* 22px */
  --fs-xl: 1.875rem;   /* 30px */
  --fs-xxl: 2.75rem;   /* 44px – timer digits */
  --lh: 1.5;

  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 24px;
  --radius-pill: 999px;
  --gap: 16px;
  --tap: 48px;               /* minimum touch target */
  --focus-ring: 3px;

  --dur-fast: 140ms;
  --dur-med: 260ms;
  --dur-slow: 600ms;
  --ease: cubic-bezier(.2,.8,.2,1);

  /* default theme = orman */
  color-scheme: light;
}

/* ---------- 1. ORMAN ŞAFAĞI / Forest Dawn (light, calm green) ---------- */
:root, [data-theme="orman"] {
  color-scheme: light;
  --bg: #F3F0E6;
  --surface: #FFFDF7;
  --surface-2: #E9E6D9;
  --text: #22322A;
  --muted: #56675C;
  --accent: #2C6E50;
  --on-accent: #FFFFFF;
  --accent-soft: #D7E8DD;
  --success: #2B7148;
  --success-soft: #DCEFE2;
  --warn: #96570B;
  --warn-soft: #F6E7CF;
  --target: #1F64A8;       /* blue  – always paired with a shape cue */
  --distractor: #C2601E;   /* orange – CVD-safe vs blue */
  --line: #D5D1C2;
  --shadow: 0 2px 10px rgba(34, 50, 42, .08);
  --font-display: var(--font-round);
  --bg-art:
    radial-gradient(120% 60% at 50% 0%, #FBE9CF 0%, rgba(251,233,207,0) 60%),
    radial-gradient(90% 50% at 10% 100%, #DDE8D8 0%, rgba(221,232,216,0) 70%),
    linear-gradient(180deg, #F7F1E3 0%, #F3F0E6 100%);
}

/* ---------- 2. GECE OKYANUSU / Night Ocean (dark, low-glare) ---------- */
[data-theme="gece"] {
  color-scheme: dark;
  --bg: #0F1B2D;
  --surface: #18283F;
  --surface-2: #213452;
  --text: #EAF0F8;
  --muted: #A6B6CC;
  --accent: #86CBF5;
  --on-accent: #0F1B2D;
  --accent-soft: #1F3B5A;
  --success: #74D6A8;
  --success-soft: #1A3B3A;
  --warn: #F3BC85;
  --warn-soft: #3A3030;
  --target: #FFD36B;       /* warm yellow */
  --distractor: #8C9EFF;   /* periwinkle */
  --line: #2A3F5E;
  --shadow: 0 2px 14px rgba(0, 0, 0, .35);
  --font-display: var(--font-round);
  --bg-art:
    radial-gradient(70% 40% at 80% 8%, rgba(134,203,245,.16) 0%, rgba(134,203,245,0) 70%),
    radial-gradient(120% 50% at 50% 110%, #12324A 0%, rgba(18,50,74,0) 70%),
    linear-gradient(180deg, #0B1524 0%, #0F1B2D 55%, #10233A 100%);
}

/* ---------- 3. SICAK KAĞIT / Warm Paper (cozy, low saturation) ---------- */
[data-theme="kagit"] {
  color-scheme: light;
  --bg: #F8F1E4;
  --surface: #FFFAF1;
  --surface-2: #EFE5D3;
  --text: #3A2D24;
  --muted: #6B5A4D;
  --accent: #A84A33;
  --on-accent: #FFFFFF;
  --accent-soft: #F3DDD3;
  --success: #356F4C;
  --success-soft: #DDEBDD;
  --warn: #94580E;
  --warn-soft: #F4E3C8;
  --target: #275A9E;
  --distractor: #BD6F22;
  --line: #E0D3BE;
  --shadow: 0 2px 8px rgba(58, 45, 36, .10);
  --font-display: var(--font-serif);
  --bg-art:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.55) 0 2px, transparent 3px) 0 0 / 38px 38px,
    radial-gradient(circle at 70% 60%, rgba(168,74,51,.05) 0 1.5px, transparent 2.5px) 0 0 / 27px 27px,
    linear-gradient(180deg, #FAF4E8 0%, #F8F1E4 100%);
}

/* Auto: follow OS dark mode if the app sets data-theme="auto" */
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] {
    color-scheme: dark;
    --bg: #0F1B2D; --surface: #18283F; --surface-2: #213452; --text: #EAF0F8; --muted: #A6B6CC;
    --accent: #86CBF5; --on-accent: #0F1B2D; --accent-soft: #1F3B5A; --success: #74D6A8; --success-soft: #1A3B3A;
    --warn: #F3BC85; --warn-soft: #3A3030; --target: #FFD36B; --distractor: #8C9EFF; --line: #2A3F5E;
    --shadow: 0 2px 14px rgba(0,0,0,.35); --font-display: var(--font-round);
    --bg-art: linear-gradient(180deg, #0B1524 0%, #0F1B2D 100%);
  }
}

/* ---------- Base usage helpers (optional; app may override) ---------- */
.k-root {
  background: var(--bg-art), var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font: var(--fs-m)/var(--lh) var(--font-ui);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
.k-display { font-family: var(--font-display); font-weight: 650; letter-spacing: -.01em; }
.k-muted { color: var(--muted); }
.k-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.k-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow);
  padding: 20px;
}

.k-btn {
  min-height: var(--tap); min-width: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 2px solid transparent;
  background: var(--accent); color: var(--on-accent);
  font: 600 var(--fs-m)/1 var(--font-ui);
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), filter var(--dur-fast);
}
.k-btn:hover { filter: brightness(1.06); }
.k-btn:active { transform: scale(.97); }
.k-btn--ghost { background: transparent; color: var(--text); border-color: var(--line); }
.k-btn--soft { background: var(--accent-soft); color: var(--text); }
.k-btn svg { width: 22px; height: 22px; }

:focus-visible { outline: var(--focus-ring) solid var(--accent); outline-offset: 3px; }

.k-icon { width: 24px; height: 24px; color: currentColor; flex: none; }

/* Feedback chips: colour + icon + text, never colour alone */
.k-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
  border-radius: var(--radius-pill); font-size: var(--fs-s); font-weight: 600; }
.k-chip--ok   { background: var(--success-soft); color: var(--success); }
.k-chip--warn { background: var(--warn-soft);    color: var(--warn); }

/* Game stimuli: target = filled circle, distractor = rounded square (shape + colour) */
.k-target     { background: var(--target);     border-radius: 50%; }
.k-distractor { background: var(--distractor); border-radius: 22%; }
.k-target, .k-distractor { aspect-ratio: 1; flex: none; } /* review fix: flex layouts squeezed the circle into an oval */

/* Gentle motion primitives */
@keyframes k-float  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
@keyframes k-pop    { 0% { transform: scale(.9); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
@keyframes k-breathe{ 0%,100% { transform: scale(.82) } 50% { transform: scale(1) } }
@keyframes k-twinkle{ 0%,100% { opacity: .35 } 50% { opacity: .9 } }
.k-float  { animation: k-float 4s var(--ease) infinite; }
.k-pop    { animation: k-pop var(--dur-med) var(--ease) both; }
.k-twinkle{ animation: k-twinkle 5s ease-in-out infinite; }

/* Reduced motion: keep state changes, drop movement */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}
/* App-level override (settings toggle sets data-motion="reduce" on <html>) */
[data-motion="reduce"] *, [data-motion="reduce"] *::before, [data-motion="reduce"] *::after {
  animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important;
}

/* Higher contrast when requested */
@media (prefers-contrast: more) {
  :root, [data-theme] { --muted: var(--text); --line: var(--muted); }
  .k-card { border-width: 2px; }
}
@media (forced-colors: active) {
  .k-btn { border-color: ButtonText; }
  .k-target, .k-distractor { forced-color-adjust: none; }
}

</style>
<style>
/* KONSANTRASYON app styles (on top of 06_themes/themes.css) */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; touch-action: manipulation; overflow-x: hidden; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
a { color: var(--accent); }

.bgart { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.bgart svg { width: 100%; height: 100%; display: block; }
@media (min-width: 700px) { .bgart { display: none; } }

.app {
  max-width: 560px; margin: 0 auto;
  min-height: 100vh; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px)
           calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px);
}
section { display: flex; flex-direction: column; gap: var(--gap); }

/* bars */
.bar { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.bar h1 { font-size: var(--fs-l); flex: 1; }
.appname { font-size: var(--fs-l); flex: 1; letter-spacing: .04em; }
.iconbtn {
  width: var(--tap); height: var(--tap); display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  cursor: pointer; padding: 0; text-decoration: none; flex: none;
}
.sysbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
  background: var(--warn-soft); color: var(--warn); border-radius: var(--radius-m); padding: 8px 8px 8px 14px; font-size: var(--fs-s); }
.sysbar p { flex: 1; }
.sysbar .iconbtn { background: transparent; border: none; color: inherit; }

/* text bits */
.hint { font-size: var(--fs-s); color: var(--muted); }
.small { font-size: var(--fs-xs); color: var(--muted); }
.lead { color: var(--muted); }
.big { font-size: var(--fs-xl); }
.center { text-align: center; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.k-card h2 { font-size: var(--fs-l); margin-bottom: 8px; }
.k-card > * + * { margin-top: 8px; }
.k-btn { text-decoration: none; text-align: center; line-height: 1.2; padding: 10px 20px; }
.k-btn:disabled { opacity: .45; cursor: default; }
.k-btn.wide { width: 100%; }
.k-btn--ghost.k-btn, .k-btn--soft.k-btn { font-weight: 600; }
.mascot { width: 112px; height: 112px; margin: 0 auto; }
.mascot svg { width: 100%; height: 100%; display: block; }
.mascot.sm { width: 84px; height: 84px; }

/* home */
.greet h1 { font-size: var(--fs-xl); }
.homehead { display: flex; align-items: center; gap: 14px; }
.homehead .mascot { margin: 0; flex: none; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  display: flex; flex-direction: column; gap: 6px; min-height: 132px; padding: 16px;
  text-decoration: none; color: var(--text);
}
.tile .k-icon { width: 30px; height: 30px; color: var(--accent); }
.tile b { font-size: var(--fs-l); font-family: var(--font-display); }
.tile span { font-size: var(--fs-s); color: var(--muted); }
.links { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tlink { min-height: var(--tap); display: inline-flex; align-items: center; padding: 0 12px; color: var(--accent); font-weight: 600; }
.banner { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); background: var(--accent-soft); border-radius: var(--radius-m); padding: 12px 16px; min-height: var(--tap); font-weight: 600; }
.ded { background: var(--accent-soft); }
.ded p { font-family: var(--font-display); font-size: var(--fs-l); }

/* lists of choice cards */
.choice {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-m);
  padding: 12px 16px; min-height: 56px; cursor: pointer;
}
.choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice .sub { display: block; font-size: var(--fs-s); color: var(--muted); }
.choice .tick { margin-left: auto; color: var(--accent); visibility: hidden; }
.choice[aria-checked="true"] .tick { visibility: visible; }
.gamecard { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--text); }
.gamecard b { font-size: var(--fs-l); font-family: var(--font-display); }

/* segmented control */
.seg { display: flex; gap: 6px; background: var(--surface-2); border-radius: var(--radius-pill); padding: 4px; }
.seg button {
  flex: 1; min-height: var(--tap); border: 0; border-radius: var(--radius-pill); background: transparent;
  font-weight: 600; cursor: pointer; padding: 4px 8px; line-height: 1.15; color: var(--text);
}
.seg button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }
.lbl { font-weight: 600; display: block; }
.field { display: flex; flex-direction: column; gap: 8px; }

/* switch row (button role=switch / role=checkbox) */
.swrow {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--tap); padding: 6px 0;
  background: none; border: 0; cursor: pointer; text-align: left; font-weight: 600;
}
.swrow > span:first-child { flex: 1; }
.sw { position: relative; width: 52px; height: 32px; border-radius: 16px; background: var(--line); flex: none; transition: background var(--dur-fast); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); transition: transform var(--dur-fast) var(--ease); }
[aria-checked="true"] > .sw { background: var(--accent); }
[aria-checked="true"] > .sw::after { transform: translateX(20px); }
.box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--muted); flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--on-accent); }
[aria-checked="true"] > .box { background: var(--accent); border-color: var(--accent); }
.swrow.cb { font-weight: 500; }

/* range: 44px tall hit area */
input[type="range"].range { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; cursor: pointer; }
.range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: var(--shadow); }
.range::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
.range::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); }

/* inputs */
.inp, textarea.inp {
  width: 100%; min-height: var(--tap); padding: 10px 14px; border-radius: var(--radius-m);
  border: 2px solid var(--line); background: var(--surface); font-size: 16px; /* 16px: no iOS zoom */
}
textarea.inp { min-height: 88px; resize: vertical; }
.inp:focus { border-color: var(--accent); outline: none; }

/* games */
.ex { display: flex; gap: 16px; align-items: center; justify-content: center; padding: 6px 0; }
.ex .k-target, .ex .k-distractor { width: 44px; }
.ex .k-icon { color: var(--accent); }
.play { position: relative; display: flex; flex-direction: column; gap: 10px; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; flex: 1; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; }
.area {
  position: relative; height: 58vh; height: 58dvh; min-height: 300px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  cursor: pointer; padding: 16px;
}
.stim { width: 112px; transition: transform 60ms linear; }
@media (min-width: 700px) { .stim { width: 140px; } }
.stim.off { visibility: hidden; }
.stim.hit { transform: scale(.9); }
[data-motion="reduce"] .stim.hit { transform: none; outline: 4px solid var(--text); outline-offset: 4px; }
.feedback { min-height: 34px; display: flex; justify-content: center; }
.hcard { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-l); border: 4px solid var(--line); background: var(--surface); color: var(--accent); }
.hcard.ok { border-color: var(--success); }
.same { width: 100%; min-height: 64px; font-size: var(--fs-l); }
.zt { font-size: var(--fs-xl); font-family: var(--font-display); text-align: center; }
.zbtn { min-width: 180px; min-height: 64px; font-size: var(--fs-l); }
.overlay {
  position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
  background: var(--bg); border-radius: var(--radius-l);
}
.ready { font-size: var(--fs-xl); font-family: var(--font-display); color: var(--muted); }
.res-main { font-size: var(--fs-xxl); line-height: 1.1; }

/* timer */
.ringwrap { position: relative; width: min(72vw, 260px); aspect-ratio: 1; margin: 0 auto; }
.ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ringwrap .bgc { stroke: var(--surface-2); }
.ringwrap .fgc { stroke: var(--accent); transition: stroke-dashoffset .25s linear; }
.ringwrap .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tnum { font-size: var(--fs-xxl); font-weight: 600; }

/* breathe */
.bcircle { position: relative; width: min(70vw, 260px); aspect-ratio: 1; margin: 8px auto; border-radius: 50%; border: 4px solid var(--accent); transform: scale(.82); display: flex; align-items: center; justify-content: center; flex-direction: column; }
.bcircle .fill { position: absolute; inset: 0; border-radius: 50%; background: var(--accent-soft); }
.bcircle .txt { position: relative; font-size: var(--fs-l); font-family: var(--font-display); font-weight: 650; text-align: center; }
.bcircle .cnt { position: relative; font-size: var(--fs-xl); }

/* progress */
.dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: var(--fs-xs); color: var(--muted); }
.dot { width: 22px; height: 22px; border-radius: 50%; margin: 0 auto 4px; background: var(--line); }
.dot.on { background: var(--accent); }
.dot.today { outline: 3px solid var(--text); outline-offset: 2px; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { padding: 8px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }

/* settings */
.swatch { width: 40px; height: 40px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
.swatch i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }
.swatch.auto { background: linear-gradient(135deg, #F3F0E6 50%, #0F1B2D 50%); }

/* feedback */
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mood { min-height: 64px; border-radius: var(--radius-m); border: 2px solid var(--line); background: var(--surface); font-size: 28px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 2px; }
.mood small { font-size: 11px; color: var(--muted); line-height: 1.1; }
.mood[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.preview { white-space: pre-wrap; word-break: break-word; font-family: var(--font-num); font-size: var(--fs-s); background: var(--surface-2); border-radius: var(--radius-m); padding: 12px; margin: 0; user-select: text; -webkit-user-select: text; }
/* .k-icon fixes 24px in themes.css; game icons need their own size */
.hcard .k-icon { width: 96px; height: 96px; }
.ex .k-icon { width: 44px; height: 44px; }
/* v1.1 P1-9: fade the background art behind text-heavy screens */
body[data-route="feedback"] .bgart, body[data-route="about"] .bgart { opacity: .3; }

</style>
</head>
<body class="k-root">

<div class="bgart" id="bgart" aria-hidden="true"></div>
<div class="app">
  <div id="sys" class="sysbar" role="status" hidden></div>
  <section data-screen="home" hidden></section>
  <section data-screen="games" hidden></section>
  <section data-screen="game" hidden></section>
  <section data-screen="timer" hidden></section>
  <section data-screen="breathe" hidden></section>
  <section data-screen="progress" hidden></section>
  <section data-screen="settings" hidden></section>
  <section data-screen="feedback" hidden></section>
  <section data-screen="about" hidden></section>
</div>
<script>
/* KONSANTRASYON — 06_themes/sound.js
 * window.KSound: fully synthesized sound library (Web Audio API). No audio files, no network.
 *
 * Design rules (see themes_proposal.md):
 *  - Every sound is short, soft, rounded (sine/triangle + low-pass), no harsh square buzzers.
 *  - wrong() is a gentle low "hmm" – quieter than correct(), and gets even quieter if repeated quickly.
 *  - correct() rotates through pentatonic intervals so it does not become grating with repetition.
 *  - Noise & ambient music fade in/out; nothing starts without a user gesture (init()).
 *
 * API:
 *   KSound.init()                        -> Promise; call inside a click/touch handler
 *   KSound.tap() correct() wrong() levelUp() streak(n) tick() timerEnd()
 *   KSound.breatheIn(sec) / breatheOut(sec) -> returns {stop()}
 *   KSound.startNoise('white'|'pink'|'brown', vol0to1) / stopNoise()
 *   KSound.startAmbient('orman'|'gece'|'kagit', vol0to1) / stopAmbient()
 *   KSound.setMasterVolume(v) getMasterVolume()
 *   KSound.setSfxVolume(v) setNoiseVolume(v) setAmbientVolume(v)
 *   KSound.toggleMute() setMuted(bool) isMuted()
 *   KSound.isReady()
 */
(function (global) {
  'use strict';

  var AC = global.AudioContext || global.webkitAudioContext;
  var ctx = null, master, comp, sfxBus, noiseBus, ambBus, ambWet, reverb;
  var masterVol = 0.8, muted = false;
  var sfxVol = 0.9, noiseVol = 0.35, ambVol = 0.35;
  var noiseBuffers = {}, noiseSrc = null, noiseGain = null, noiseType = null;
  var amb = null; // ambient state
  var lastWrong = 0, wrongRun = 0, correctIdx = 0;
  var STORE = 'ksound.v1';

  // ---------- persistence (optional; ignored if storage blocked) ----------
  function load() {
    try {
      var s = JSON.parse(global.localStorage.getItem(STORE) || '{}');
      if (typeof s.master === 'number') masterVol = s.master;
      if (typeof s.muted === 'boolean') muted = s.muted;
      if (typeof s.sfx === 'number') sfxVol = s.sfx;
      if (typeof s.noise === 'number') noiseVol = s.noise;
      if (typeof s.amb === 'number') ambVol = s.amb;
    } catch (e) {}
  }
  function save() {
    try {
      global.localStorage.setItem(STORE, JSON.stringify({ master: masterVol, muted: muted, sfx: sfxVol, noise: noiseVol, amb: ambVol }));
    } catch (e) {}
  }
  load();

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function now() { return ctx.currentTime; }
  function ready() { return !!ctx && ctx.state !== 'closed'; }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function ramp(param, value, time, t0) {
    var t = t0 != null ? t0 : now();
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(value, t + time);
  }

  // ---------- graph ----------
  function build() {
    ctx = new AC({ latencyHint: 'interactive' });
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 3;
    comp.attack.value = 0.005; comp.release.value = 0.25;
    master = ctx.createGain();
    master.gain.value = muted ? 0 : masterVol;
    comp.connect(master); master.connect(ctx.destination);

    sfxBus = ctx.createGain(); sfxBus.gain.value = sfxVol; sfxBus.connect(comp);
    noiseBus = ctx.createGain(); noiseBus.gain.value = noiseVol; noiseBus.connect(comp);
    ambBus = ctx.createGain(); ambBus.gain.value = ambVol; ambBus.connect(comp);

    // procedural reverb: decaying stereo noise impulse
    reverb = ctx.createConvolver();
    reverb.buffer = makeImpulse(2.8, 2.6);
    ambWet = ctx.createGain(); ambWet.gain.value = 0.55;
    reverb.connect(ambWet); ambWet.connect(comp); // review fix: sfx reverb no longer silenced when ambient is off
    var ambSend = ctx.createGain(); ambSend.gain.value = 1 / 0.7; // keeps old dry/wet ratio (dry 0.7, send 1)
    ambBus.connect(ambSend); ambSend.connect(reverb);
    // a touch of reverb on sfx too, so chimes ring softly
    var sfxVerb = ctx.createGain(); sfxVerb.gain.value = 0.18;
    sfxBus.connect(sfxVerb); sfxVerb.connect(reverb);
  }

  function makeImpulse(seconds, decay) {
    var rate = ctx.sampleRate, len = Math.floor(rate * seconds);
    var buf = ctx.createBuffer(2, len, rate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c), lp = 0;
      for (var i = 0; i < len; i++) {
        var w = Math.random() * 2 - 1;
        lp = lp + 0.35 * (w - lp); // darken
        d[i] = lp * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function init() {
    if (!AC) return Promise.resolve(false);
    if (!ctx) build();
    // iOS unlock: play a 1-sample silent buffer inside the gesture
    try {
      var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    } catch (e) {}
    if (ctx.state === 'suspended' || ctx.state === 'interrupted') return ctx.resume().then(function () { return true; }, function () { return false; });
    return Promise.resolve(true);
  }

  // Auto-resume if the OS suspended us (e.g. phone call) and the user taps again
  function ensure() {
    if (!ctx) return false;
    if (ctx.state === 'suspended' || ctx.state === 'interrupted') { ctx.resume().catch(function () {}); } // iOS uses 'interrupted'
    return true;
  }

  // ---------- voice helpers ----------
  /** Soft enveloped oscillator note. */
  function tone(freq, t, dur, o) {
    o = o || {};
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    var f = ctx.createBiquadFilter();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.glideTo) osc.frequency.exponentialRampToValueAtTime(o.glideTo, t + (o.glideTime || dur));
    if (o.detune) osc.detune.value = o.detune;
    f.type = 'lowpass'; f.frequency.value = o.cutoff || 4000; f.Q.value = 0.5;
    var peak = o.gain != null ? o.gain : 0.25, a = o.attack || 0.005, r = o.release || dur;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + r);
    osc.connect(f); f.connect(g); g.connect(o.dest || sfxBus);
    if (o.pan != null && ctx.createStereoPanner) {
      var p = ctx.createStereoPanner(); p.pan.value = o.pan;
      g.disconnect(); g.connect(p); p.connect(o.dest || sfxBus);
    }
    osc.start(t); osc.stop(t + a + r + 0.05);
    return osc;
  }

  /** Bell = a few (slightly inharmonic) partials. */
  function bell(freq, t, o) {
    o = o || {};
    var g = o.gain != null ? o.gain : 0.18, len = o.len || 1.6;
    tone(freq, t, len, { type: 'sine', gain: g, attack: 0.004, release: len, dest: o.dest, pan: o.pan });
    tone(freq * 2.0, t, len * 0.6, { type: 'sine', gain: g * 0.35, attack: 0.003, release: len * 0.6, dest: o.dest, pan: o.pan });
    tone(freq * 3.01, t, len * 0.3, { type: 'sine', gain: g * 0.12, attack: 0.002, release: len * 0.3, dest: o.dest, pan: o.pan });
    if (o.inharm) tone(freq * 2.76, t, len * 0.5, { type: 'sine', gain: g * 0.15, attack: 0.002, release: len * 0.5, dest: o.dest });
  }

  function noiseBurst(t, dur, o) {
    o = o || {};
    var src = ctx.createBufferSource(); src.buffer = getNoise('white');
    var f = ctx.createBiquadFilter(); f.type = o.ftype || 'bandpass';
    f.frequency.value = o.freq || 2000; f.Q.value = o.q || 1;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.gain || 0.1, t + (o.attack || 0.002));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || sfxBus);
    src.start(t, Math.random() * 2); src.stop(t + dur + 0.05);
    return { src: src, filter: f, gain: g };
  }

  // C major pentatonic (MIDI) for rewards
  var PENTA = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93];

  // ---------- UI / game SFX ----------
  function tap() {
    if (!ensure()) return;
    var t = now();
    tone(880, t, 0.06, { type: 'sine', gain: 0.10, attack: 0.002, release: 0.06, cutoff: 3000 });
    tone(1320, t, 0.03, { type: 'sine', gain: 0.03, attack: 0.001, release: 0.03 });
  }

  function correct() {
    if (!ensure()) return;
    var t = now();
    // rotate among pleasant intervals to avoid listener fatigue
    var pairs = [[0, 2], [1, 3], [2, 4], [0, 3]];
    var p = pairs[correctIdx++ % pairs.length];
    bell(mtof(PENTA[p[0]]), t, { gain: 0.13, len: 0.5 });
    bell(mtof(PENTA[p[1]]), t + 0.075, { gain: 0.15, len: 0.8 });
  }

  function wrong() {
    if (!ensure()) return;
    var t = now(), ms = Date.now();
    // repeated mistakes within 2 s get progressively softer (never nagging)
    wrongRun = (ms - lastWrong < 2000) ? Math.min(wrongRun + 1, 4) : 0;
    lastWrong = ms;
    var g = 0.12 * Math.pow(0.7, wrongRun);
    // soft low "hmm": two detuned triangles sliding gently down a whole tone, heavily low-passed
    tone(262, t, 0.28, { type: 'triangle', gain: g, attack: 0.02, release: 0.28, glideTo: 233, glideTime: 0.22, cutoff: 700 });
    tone(262, t, 0.28, { type: 'sine', gain: g * 0.6, attack: 0.02, release: 0.28, glideTo: 233, glideTime: 0.22, detune: -8, cutoff: 700 });
  }

  function levelUp() {
    if (!ensure()) return;
    var t = now(), seq = [0, 2, 3, 4, 5];
    for (var i = 0; i < seq.length; i++) {
      bell(mtof(PENTA[seq[i]]), t + i * 0.09, { gain: 0.11 + i * 0.01, len: 0.9, pan: -0.4 + i * 0.2 });
    }
    // warm resolving chord + shimmer
    var tc = t + seq.length * 0.09 + 0.05;
    [60, 67, 72, 76].forEach(function (m, k) {
      tone(mtof(m), tc, 1.6, { type: 'triangle', gain: 0.05, attack: 0.04, release: 1.6, cutoff: 2200, pan: (k - 1.5) * 0.3 });
    });
    noiseBurst(tc, 0.9, { ftype: 'highpass', freq: 7000, gain: 0.02, attack: 0.1 });
  }

  /** Streak chime: n notes (capped at 5), climbing higher as the streak grows. */
  function streak(n) {
    if (!ensure()) return;
    n = Math.max(1, Math.floor(n || 1));
    var t = now(), count = Math.min(n, 5);
    var base = Math.min(Math.floor(n / 3), PENTA.length - count);
    for (var i = 0; i < count; i++) {
      bell(mtof(PENTA[base + i]), t + i * 0.07, { gain: 0.09 + 0.012 * i, len: 0.55 });
    }
  }

  function tick() {
    if (!ensure()) return;
    var t = now();
    noiseBurst(t, 0.025, { freq: 3200, q: 4, gain: 0.05 });
    tone(1800, t, 0.02, { type: 'sine', gain: 0.025, attack: 0.001, release: 0.02 });
  }

  /** Gentle "singing bowl" – three soft strikes, long ring. */
  function timerEnd() {
    if (!ensure()) return;
    var t = now();
    [0, 1.1, 2.2].forEach(function (d, i) {
      var f = [mtof(69), mtof(76), mtof(81)][i];
      bell(f, t + d, { gain: 0.16, len: 3.2, inharm: true });
      tone(f / 2, t + d, 3.2, { type: 'sine', gain: 0.05, attack: 0.01, release: 3.2 });
    });
  }

  // ---------- breathing ----------
  function breath(sec, up) {
    if (!ensure()) return { stop: function () {} };
    sec = clamp(+sec || 4, 1, 20);
    var t = now(), end = t + sec;
    // airy whoosh: pink noise through a moving band-pass
    var src = ctx.createBufferSource(); src.buffer = getNoise('pink'); src.loop = true;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(up ? 350 : 1400, t);
    bp.frequency.exponentialRampToValueAtTime(up ? 1400 : 300, end);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.10, t + sec * 0.35);
    g.gain.linearRampToValueAtTime(0.06, t + sec * 0.8);
    g.gain.linearRampToValueAtTime(0.0001, end);
    src.connect(bp); bp.connect(g); g.connect(sfxBus);
    src.start(t, Math.random() * 3); src.stop(end + 0.1);
    // soft tonal guide (fifth apart, glides up on inhale / down on exhale)
    var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), tg = ctx.createGain();
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    o1.type = 'sine'; o2.type = 'triangle';
    var f0 = up ? 196 : 262, f1 = up ? 262 : 196;
    o1.frequency.setValueAtTime(f0, t); o1.frequency.exponentialRampToValueAtTime(f1, end);
    o2.frequency.setValueAtTime(f0 * 1.5, t); o2.frequency.exponentialRampToValueAtTime(f1 * 1.5, end);
    tg.gain.setValueAtTime(0.0001, t);
    tg.gain.linearRampToValueAtTime(0.05, t + Math.min(1, sec * 0.3));
    tg.gain.setValueAtTime(0.05, end - Math.min(1, sec * 0.3));
    tg.gain.linearRampToValueAtTime(0.0001, end);
    o1.connect(lp); o2.connect(lp); lp.connect(tg); tg.connect(sfxBus);
    o1.start(t); o2.start(t); o1.stop(end + 0.1); o2.stop(end + 0.1);
    return {
      stop: function () {
        var n = now();
        [g, tg].forEach(function (x) { ramp(x.gain, 0.0001, 0.25, n); });
        try { src.stop(n + 0.3); o1.stop(n + 0.3); o2.stop(n + 0.3); } catch (e) {}
      }
    };
  }
  function breatheIn(sec) { return breath(sec, true); }
  function breatheOut(sec) { return breath(sec, false); }

  // ---------- noise ----------
  function getNoise(type) {
    if (noiseBuffers[type]) return noiseBuffers[type];
    var rate = ctx.sampleRate, fade = Math.floor(rate * 0.2), len = rate * 6; // 6 s seamless loop
    var tmp = new Float32Array(len + fade);
    var out = ctx.createBuffer(2, len, rate);
    for (var c = 0; c < 2; c++) {             // 2 decorrelated channels
      var i;
      if (type === 'pink') {                   // Paul Kellet's refined pink filter
        var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (i = 0; i < tmp.length; i++) {
          var w = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
          b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
          b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
          tmp[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
          b6 = w * 0.115926;
        }
      } else if (type === 'brown') {           // integrated (red/brown) noise, leaky
        var last = 0;
        for (i = 0; i < tmp.length; i++) {
          last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
          tmp[i] = last * 3.5;
        }
      } else {
        for (i = 0; i < tmp.length; i++) tmp[i] = (Math.random() * 2 - 1) * 0.5;
      }
      var d = out.getChannelData(c);
      for (i = 0; i < len; i++) d[i] = tmp[i];
      // crossfade the overflow tail into the head so the loop seam doesn't click
      for (i = 0; i < fade; i++) { var k = i / fade; d[i] = tmp[i] * k + tmp[len + i] * (1 - k); }
    }
    noiseBuffers[type] = out;
    return out;
  }

  function startNoise(type, volume) {
    if (!ensure()) return false;
    type = (type === 'pink' || type === 'brown') ? type : 'white';
    if (volume != null) setNoiseVolume(volume);
    if (noiseSrc && noiseType === type) return true;
    stopNoise(0.6);
    var src = ctx.createBufferSource(); src.buffer = getNoise(type); src.loop = true;
    var g = ctx.createGain(); g.gain.value = 0.0001;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    // tame white noise harshness slightly; pink/brown pass through
    lp.frequency.value = type === 'white' ? 9000 : 16000;
    src.connect(lp); lp.connect(g); g.connect(noiseBus);
    src.start();
    ramp(g.gain, type === 'white' ? 0.6 : 0.9, 1.5);
    noiseSrc = src; noiseGain = g; noiseType = type;
    return true;
  }

  function stopNoise(fade) {
    if (!noiseSrc || !ctx) return;
    var s = noiseSrc, g = noiseGain, f = fade == null ? 1.2 : fade;
    ramp(g.gain, 0.0001, f);
    try { s.stop(now() + f + 0.05); } catch (e) {}
    noiseSrc = noiseGain = noiseType = null;
  }

  // ---------- generative ambient ----------
  var AMBIENT = {
    // Forest dawn: bright major pentatonic, triangle plucks + occasional bird-like glide
    orman: { scale: [60, 62, 64, 67, 69], root: 48, bpm: 72, pad: [48, 55, 64], wave: 'triangle',
             pluckGain: 0.07, pluckLen: 1.4, density: 0.55, cutoff: 2600, extra: 'bird' },
    // Night ocean: D minor pentatonic, slow sine pads, swells of filtered noise (waves)
    gece:  { scale: [62, 65, 67, 69, 72], root: 38, bpm: 50, pad: [38, 45, 53, 57], wave: 'sine',
             pluckGain: 0.06, pluckLen: 2.6, density: 0.4, cutoff: 1600, extra: 'wave' },
    // Warm paper: F major pentatonic, kalimba/music-box like plucks, soft crackle
    kagit: { scale: [65, 67, 69, 72, 74], root: 41, bpm: 66, pad: [41, 48, 57], wave: 'sine',
             pluckGain: 0.08, pluckLen: 1.1, density: 0.5, cutoff: 3000, extra: 'crackle' }
  };

  function startAmbient(themeName, volume) {
    if (!ensure()) return false;
    var cfg = AMBIENT[themeName] || AMBIENT.orman;
    if (volume != null) setAmbientVolume(volume);
    if (amb && amb.name === themeName) return true;
    stopAmbient(1.0);

    var state = { name: themeName, cfg: cfg, nodes: [], timer: null, nextT: now() + 0.2, step: 0, lastNote: 2, alive: true };
    var dry = ctx.createGain(); dry.gain.value = 0.0001; dry.connect(ambBus); // reverb send now via ambBus (see build)
    var bus = ctx.createGain(); bus.gain.value = 1; bus.connect(dry);
    state.bus = bus; state.dry = dry;

    // sustained pad (very quiet, slow tremolo)
    cfg.pad.forEach(function (m, i) {
      var o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      var lfo = ctx.createOscillator(), lg = ctx.createGain();
      o.type = i === 0 ? 'sine' : 'triangle'; o.frequency.value = mtof(m); o.detune.value = (i - 1) * 4;
      f.type = 'lowpass'; f.frequency.value = 700 + i * 150;
      g.gain.value = 0.0001;
      lfo.frequency.value = 0.05 + i * 0.03; lg.gain.value = 0.008;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(f); f.connect(g); g.connect(bus);
      o.start(); lfo.start();
      g.gain.linearRampToValueAtTime(0.022 / (i + 1) + 0.008, now() + 4);
      state.nodes.push(o, lfo);
    });

    ramp(dry.gain, 0.7, 2.5);

    var beat = 60 / cfg.bpm;
    function schedule() {
      if (!state.alive) return;
      var horizon = now() + 0.6;
      while (state.nextT < horizon) {
        var t = state.nextT;
        // random-walk melody on pentatonic scale -> always consonant
        if (Math.random() < cfg.density) {
          var move = [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)];
          state.lastNote = clamp(state.lastNote + move, 0, cfg.scale.length - 1);
          var oct = Math.random() < 0.2 ? 12 : 0;
          var f = mtof(cfg.scale[state.lastNote] + oct);
          var pan = Math.random() * 1.2 - 0.6;
          tone(f, t, cfg.pluckLen, { type: cfg.wave, gain: cfg.pluckGain, attack: 0.01, release: cfg.pluckLen, cutoff: cfg.cutoff, dest: bus, pan: pan });
          if (themeName === 'kagit') // kalimba tine overtone
            tone(f * 4.0, t, 0.25, { type: 'sine', gain: cfg.pluckGain * 0.25, attack: 0.002, release: 0.25, dest: bus, pan: pan });
        }
        // bass note every 8 beats
        if (state.step % 8 === 0) {
          tone(mtof(cfg.root + [0, 7, 5, 0][(state.step / 8) % 4 | 0]), t, beat * 6, { type: 'sine', gain: 0.05, attack: 0.4, release: beat * 6, cutoff: 500, dest: bus });
        }
        // texture
        if (cfg.extra === 'bird' && Math.random() < 0.035) {
          var bf = 2200 + Math.random() * 1200;
          tone(bf, t, 0.12, { type: 'sine', gain: 0.018, attack: 0.01, release: 0.12, glideTo: bf * 1.3, glideTime: 0.1, dest: bus, pan: Math.random() * 2 - 1 });
          tone(bf * 1.1, t + 0.16, 0.1, { type: 'sine', gain: 0.014, attack: 0.01, release: 0.1, glideTo: bf * 1.4, glideTime: 0.08, dest: bus });
        }
        if (cfg.extra === 'wave' && state.step % 12 === 0) {
          var wb = noiseBurst(t, beat * 9, { ftype: 'lowpass', freq: 500, gain: 0.05, attack: beat * 4, dest: bus });
          wb.filter.frequency.linearRampToValueAtTime(900, t + beat * 4);
          wb.filter.frequency.linearRampToValueAtTime(400, t + beat * 9);
        }
        if (cfg.extra === 'crackle' && Math.random() < 0.25) {
          noiseBurst(t + Math.random() * beat, 0.012, { freq: 2500 + Math.random() * 3000, q: 6, gain: 0.025, dest: bus });
        }
        state.step++;
        state.nextT += beat;
      }
    }
    schedule();

// ---------------------------------------------------------------- game engines (spec §2)
const YK = [{ on: 1000, blank: 800, nogo: 0.2 }, { on: 800, blank: 700, nogo: 0.25 }, { on: 650, blank: 550, nogo: 0.3 }];
const HT = [{ n: 1, on: 1500, blank: 1000 }, { n: 2, on: 1500, blank: 1000 }, { n: 2, on: 1100, blank: 800 }];
const ZT = [[5, 8, 10], [10, 15, 20], [20, 30, 45]];
const HICONS = ['star', 'heart', 'leaf', 'moon', 'target'];
function rnd(n) { return Math.floor(Math.random() * n); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function range(a, b) { const r = []; for (let i = a; i < b; i++) r.push(i); return r; }

// Yakala sequence: true = go (circle). Exactly round(60*rate) no-go, first 3 go, never 3 no-go in a row.
function genYakala(lv) {
  const N = 60, k = Math.round(N * YK[lv].nogo);
  for (;;) {
    const a = new Array(N).fill(true);
    shuffle(range(3, N)).slice(0, k).forEach(i => { a[i] = false; });
    let run = 0, ok = true;
    for (let i = 0; i < N && ok; i++) { run = a[i] ? 0 : run + 1; if (run > 2) ok = false; }
    if (ok) return a;
  }
}
// Hatırla: n lead-ins (distinct, unscored) + 30 scored, 9 matches; non-matches differ from the item n back.
function genHatirla(lv) {
  const n = HT[lv].n, items = [], match = [];
  const mset = new Set(shuffle(range(0, 30)).slice(0, 9));
  for (let i = 0; i < n; i++) { let x; do { x = rnd(5); } while (items.indexOf(x) >= 0); items.push(x); match.push(false); }
  for (let j = 0; j < 30; j++) {
    const prev = items[items.length - n];
    if (mset.has(j)) { items.push(prev); match.push(true); }
    else { let x; do { x = rnd(5); } while (x === prev); items.push(x); match.push(false); }
  }
  return { n, items, match };
}

  return Math.round(s / ests.length * 100);
}

let G = null;          // running game

function gPlayMs() { return G.playMs + (G.segStart != null ? performance.now() - G.segStart : 0); }

function setProg(i, n) { const p = $('.progress i'); if (p) p.style.width = (100 * i / n) + '%'; }
function stage(html) { const a = $('.area'); if (a) a.innerHTML = html; }
function chip(cls, key, ms) {
  const f = $('.feedback'); if (!f) return;
  f.innerHTML = '<span class="k-chip ' + cls + '">' + esc(t(key)) + '</span>';
  const g = G; later(() => { if (G === g) f.innerHTML = ''; }, ms);
}
function gReady(fn) {

const ENG = {};
ENG.yakala = function (lv) {
  const c = YK[lv], seq = genYakala(lv), N = 60;
  let i = 0, st = null, hits = 0, cw = 0, miss = 0, fa = 0, run = 0;
  const rts = [];
  function shape() { return $('.stim'); }
  function streakCheck() { if (run > 0 && run % 10 === 0) KSound.streak(Math.min(run / 10, 5)); }
  function trial() {
    if (i >= N) {
      const rt = rts.length ? Math.round(rts.reduce((a, b) => a + b, 0) / rts.length) : null;
      return gFinish({ acc: Math.round((hits + cw) / N * 100), rt, miss, fa });
    }
    stage('<div class="stim ' + (seq[i] ? 'k-target' : 'k-distractor') + '"></div>');
    $('.area').setAttribute('data-kind', seq[i] ? 'go' : 'nogo');
    st = { go: seq[i], onset: performance.now(), resp: false };
    setProg(i, N);
    later(() => { const s = shape(); if (s) s.classList.add('off'); $('.area').setAttribute('data-kind', ''); }, c.on);
    later(endTrial, c.on + c.blank);
  }
  function endTrial() {
    if (!st.resp) { if (st.go) { miss++; run = 0; } else { cw++; run++; streakCheck(); } }
    st = null; i++; trial();
  }
  return {
    begin: trial, resume: trial,
    discard() { if (st && st.resp) { if (st.go) { hits--; rts.pop(); } else fa--; } st = null; }, // trial is repeated
    progress() { return [i, N]; },
    respond() {
      if (!st || st.resp) return;
      st.resp = true;
      if (st.go) {
        hits++; rts.push(performance.now() - st.onset); KSound.tap(); run++; streakCheck();
        const s = shape(); if (s) { s.classList.add('hit'); later(() => s.classList.remove('hit'), 120); }
      } else { fa++; run = 0; chip('k-chip--warn', 'yakala.oops', 600); }
    }
  };
};
ENG.hatirla = function (lv) {
  const c = HT[lv], g = genHatirla(lv), N = g.items.length;
  let i = 0, st = null, hits = 0, cr = 0, fa = 0;
  function trial() {
    if (i >= N) return gFinish({ acc: Math.round((hits + cr) / 30 * 100), hits, fa });
    const card = $('.hcard');
    card.classList.remove('ok');
    card.innerHTML = icon(HICONS[g.items[i]], { size: 96, label: false });
    const a = $('.area');
    a.setAttribute('data-kind', i < g.n ? 'lead' : g.match[i] ? 'match' : 'other');
    st = { match: g.match[i], lead: i < g.n, resp: false };
    setProg(i, N);
    later(() => { const k = $('.hcard'); if (k) k.innerHTML = ''; }, c.on);
    later(endTrial, c.on + c.blank);
  }
  function endTrial() {
    if (!st.lead && !st.resp) { if (st.match) chip('', 'hatirla.missed', 600); else cr++; }
    st = null; i++; trial();
  }
  function frame() {
    stage('<div class="hcard" aria-live="off"></div><button class="k-btn same" data-resp="1">' + esc(t('hatirla.same')) + '</button>');
    $('.area').setAttribute('aria-label', t(c.n === 1 ? 'hatirla.rules1' : 'hatirla.rules2').replace(/\*\*/g, ''));
  }

    begin() { frame(); trial(); }, resume() { frame(); trial(); },
    discard() { if (st && st.resp && !st.lead) { if (st.match) hits--; else fa--; } st = null; }, // trial is repeated
    progress() { return [i, N]; },
    respond(e) {

      if (!st || st.resp) return;
      st.resp = true;
      if (st.lead) return;
      if (st.match) {
        hits++; KSound.correct();
        const k = $('.hcard'); if (k) { k.classList.add('ok'); later(() => { const k2 = $('.hcard'); if (k2) k2.classList.remove('ok'); }, 300); }

    }

};
ENG.zaman = function (lv) {
  const targets = range(0, 5).map(() => ZT[lv][rnd(3)]), ests = [];
  let r = 0, sub = null, t0 = 0, early = 0, late = 0;
  function showTarget() {
    sub = 'target'; setProg(r, 5);
    $('.area').setAttribute('data-kind', 'target');
    stage('<p class="zt">' + esc(t('zaman.target', { n: targets[r] })) + '</p><button class="k-btn zbtn" data-resp="1">' + esc(t('zaman.go')) + '</button>');

  function goWait() {
    sub = 'wait'; t0 = performance.now();

function better(id, s, p) {

// ---------------------------------------------------------------- focus timer (spec §3)
const PRESET_MS = { '15': 15 * 6e4, '25': 25 * 6e4, '2': 2 * 6e4 }, BREAK_MS = 5 * 6e4;
const BREAKS = ['break.move', 'break.water', 'break.walk', 'break.breathe'];
let tDoneHidden = false, tView = null, tAway = false, tKept = false, tConfirm = false, tTip = null, tPrev = null, tStep = '';
function tLeft(tm) { return tm.endAt != null ? tm.endAt - Date.now() : tm.pausedLeftMs; }
function tStart(phase, preset, step) {
  const total = phase === 'break' ? BREAK_MS : PRESET_MS[preset];
  data.timer = { phase, preset, totalMs: total, endAt: Date.now() + total, pausedLeftMs: null, step: step || '', startedAt: Date.now() };
  tView = null; tAway = false; tKept = false; tConfirm = false;
  save();
}
function tPause() { const tm = data.timer; if (!tm || tm.endAt == null) return; tm.pausedLeftMs = Math.max(0, tm.endAt - Date.now()); tm.endAt = null; save(); }
function tResume() { const tm = data.timer; if (!tm || tm.endAt != null) return; tm.endAt = Date.now() + tm.pausedLeftMs; tm.pausedLeftMs = null; save(); }
function tCheck() {
  const tm = data.timer;
  if (!tm || tm.endAt == null) return;
  const ago = Date.now() - tm.endAt;
  if (ago < 0) return;
  if (tm.phase !== 'break') logSession({ t: tm.endAt, kind: 'focus', sec: Math.round(tm.totalMs / 1000), done: true });
  tView = ago > 3600000 ? null : tm.phase === 'focus' ? 'focusDone' : tm.phase === 'break' ? 'breakDone' : 'starterDone'; // P0-6: no stale break offer
  tPrev = { preset: tm.preset, step: tm.step };
  if (tView === 'focusDone') tTip = BREAKS[rnd(4)];
  data.timer = null; tConfirm = false; save();
  if (ago < 60000) KSound.timerEnd(); // a long-stale end stays silent
  tAway = ago > 2000;
  if (document.hidden) tDoneHidden = true;
  if (route === 'timer' || route === 'home') render();
}
function tStopNow() {

let fbStatus = '';

function fbUpdate() {
  data.feedbackDraft = Object.assign({}, fb); saveSoon();
  const p = document.getElementById('fbprev'); if (p) p.textContent = composeFeedback();
  sections.feedback.querySelectorAll('[data-act="fbSend"],[data-act="fbCopy"]').forEach(b => { b.disabled = !fbFilled(); });
}
function fbDone(key) {

}

    const p = document.getElementById('fbprev'), sel = window.getSelection(), r = document.createRange();

  dedOk() { data.settings.dedicationSeen = true; save(); renderHome(); },
  lvl(el) { data.levels[gameId()] = +el.dataset.v; save(); renderGame(); },
  lvlSug(el) { data.levels[gameId()] = +el.dataset.v; suggest[gameId()] = null; save(); gView = 'intro'; renderGame(); },
  gStart, gQuit, gResume,
  gAgain() { gView = 'intro'; gStart(); },
  preset(el) { data.timerPreset = el.dataset.v; save(); renderTimer(); },
  tGo() { const p = data.timerPreset; tStart(p === '2' ? 'starter' : 'focus', p, tStep.trim()); renderTimer(); },
  tPause() { if (data.timer) { if (data.timer.endAt == null) tResume(); else tPause(); } renderTimer(); },
  tStop() { tConfirm = true; renderTimer(); },
  tStopNo() { tConfirm = false; renderTimer(); },
  tStopYes() { tStopNow(); renderTimer(); },
  tBreak() { tStart('break', tPrev.preset, tPrev.step); renderTimer(); },
  tAgain() { tStart('focus', tPrev.preset, tPrev.step); renderTimer(); },
  tCont(el) { data.timerPreset = el.dataset.v; tStart('focus', el.dataset.v, tPrev.step); renderTimer(); },
  tLeave() { tView = null; tKept = true; renderTimer(); },
  tIdle() { tView = null; tAway = false; renderTimer(); },
  toBreathe1() { tView = null; brLen = 1; go('breathe'); },
  noise(el) {
    noiseType = el.dataset.v;
    if (noiseType === 'off') KSound.stopNoise(); else KSound.startNoise(noiseType);
    render();
  },
  music() { musicOn = !musicOn; if (musicOn) KSound.startAmbient(curTheme()); else KSound.stopAmbient(); render(); },
  brLen(el) { brLen = +el.dataset.v; renderBreathe(); },
  brSound() { data.settings.breathSound = !data.settings.breathSound; save(); renderBreathe(); },
  brStart, brResume,
  brQuit() { brLeave(); renderBreathe(); },
  theme(el) { data.settings.theme = el.dataset.v; save(); applyLook(); renderSettings(); },
  motion(el) { data.settings.motion = el.dataset.v; save(); applyLook(); renderSettings(); },
  mute() { KSound.setMuted(!KSound.isMuted()); renderSettings(); },
  reset() { resetConfirm = true; renderSettings(); },
  resetNo() { resetConfirm = false; renderSettings(); },
  resetYes() { noSave = true; try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } location.reload(); },
  mood(el) { fb.mood = +el.dataset.v; fbStatus = ''; fbUpdate(); renderFeedback(); },
  fbUsage() { fb.usage = !fb.usage; fbUpdate(); renderFeedback(); },
  fbSend, fbCopy
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  ACT[el.dataset.act](el, e);
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.inp;
  if (k === 'step') tStep = el.value;
  else if (k === 'noiseVol') KSound.setNoiseVolume(+el.value);
  else if (k === 'sfx') KSound.setSfxVolume(+el.value);
  else if (k === 'fb') { fb[el.dataset.f] = el.value; fbUpdate(); }
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea';
  if (scr() === 'game' && G && !G.paused) {
    if (e.key === 'Escape') { e.preventDefault(); gPause(); return; }
    if (e.key === ' ' || e.key === 'Enter' || (G.id === 'hatirla' && (e.key === 'j' || e.key === 'J'))) {
      e.preventDefault(); if (!e.repeat && G.eng) G.eng.respond(e); return;
    }
    return;
  }
  if (e.key !== 'Escape' || typing) return;
  if (scr() === 'game' && G && G.paused) return;
  if (route === 'timer' && data.timer && data.timer.endAt != null) { tPause(); renderTimer(); return; }
  if (route === 'breathe' && B && !B.done && !B.paused) { brPause(); return; }
  if (route !== 'home') go(backTarget());
});

// ---------------------------------------------------------------- lifecycle
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (G && !G.paused) gPause();
    if (B && !B.done) brPause();
    if (saveTimer) save();
    hiddenAt = Date.now();
    clearTimeout(hideStopTimer);
    hideStopTimer = setTimeout(() => { if (document.hidden && !timerRunning()) stopBackground(); }, 5 * 6e4);
  } else {
    clearTimeout(hideStopTimer);
    if (hiddenAt && Date.now() - hiddenAt > 5 * 6e4 && (noiseType !== 'off' || musicOn) && !timerRunning()) { stopBackground(); if (route === 'timer' || route === 'settings') render(); }
    hiddenAt = 0;
    tDoneHidden = false;
    tCheck();
  }
});
function liveTick() {
  tCheck();
  const tm = data.timer;
  if (tm) {
    const s = mmss(tLeft(tm));
    document.title = s + ' · ' + t(tm.phase === 'break' ? 'timer.breakLabel' : 'timer.focusLabel') + ' — ' + t('app.name');
    if (route === 'timer') {
      const el = sections.timer.querySelector('[data-live="time"]'); if (el) el.textContent = s;
      const r = sections.timer.querySelector('[data-live="ring"]'); if (r) r.setAttribute('stroke-dashoffset', ringOff(tm));
    } else if (route === 'home') {
      const b = sections.home.querySelector('[data-live="bannerText"]'); if (b) b.textContent = t(tm.endAt == null ? 'home.timerBannerPaused' : 'home.timerBanner', { t: s });
    }
  } else {
    const want = document.hidden && tDoneHidden ? t('timer.doneTitle') : t('app.name');
    if (document.title !== want) document.title = want;
  }
}
window.addEventListener('hashchange', onRoute);
window.addEventListener('pagehide', () => { if (G) gAbort(); else if (saveTimer) save(); });

applyLook();
save();      // lastSeen; also surfaces the no-storage banner once if storage is blocked
tCheck();    // a timer that ended while the page was closed
onRoute();
setInterval(liveTick, 250);

// Read-only hooks for the automated tests (04_app/tests). No UI.
window.KApp = { T, data, genYakala, genHatirla, devPct, composeFeedback, YK, HT, ZT, reducedMotion, curTheme };
})();

</script>
